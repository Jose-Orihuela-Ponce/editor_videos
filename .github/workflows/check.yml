name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias de interfaz
        run: npm ci
      - name: Preparar FFmpeg y FFprobe
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          npm run sidecars
      - name: Comprobar interfaz y exportaciones
        run: npm test
      - name: Compilar interfaz
        run: npm run build
      - name: Preparar Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Comprobar núcleo de escritorio
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml --lib
