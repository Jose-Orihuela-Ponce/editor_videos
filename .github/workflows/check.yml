name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias de interfaz
        run: npm ci
      - name: Preparar FFmpeg y FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Chocolatey's PATH entries are shims, not portable FFmpeg binaries.
          $packageRoot = Join-Path $env:ChocolateyInstall 'lib/ffmpeg'
          $ffmpeg = Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'No se encontró el ejecutable real de FFmpeg.' }
          $env:FFMPEG_BIN = $ffmpeg.FullName
          $env:FFPROBE_BIN = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $env:FFPROBE_BIN)) {
            throw 'No se encontró FFprobe junto a FFmpeg.'
          }
          npm run sidecars
      - name: Comprobar interfaz y exportaciones
        run: npm test
      - name: Preparar descarga de YouTube
        run: npm run automatic:setup
      - name: Compilar interfaz
        run: npm run build
      - name: Preparar Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Comprobar núcleo de escritorio
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml --lib
